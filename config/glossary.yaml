# FIN-C2-008 — Financial Terminology Glossary
#
# Purpose: Cross-language financial term alignment for TerminologyValidationNode.
# Format: each entry maps a source-language term to the expected English translation.
# Used by TerminologyValidationNode for advisory terminology validation.
#
# Extension guide:
#   - Add entries under `terms:` as {source: ..., target: ...} pairs.
#   - `source` is the term as it appears in the source document (Japanese/Chinese/etc.)
#   - `target` is the expected English translation in the translated output.
#   - Validation is case-insensitive substring search.
#   - Flags are ADVISORY only — mismatches do not block translation output.

metadata:
  version: "1.0.0"
  template_id: "FIN-C2-008"
  supported_source_languages:
    - "ja"
    - "zh"
    - "zh-cn"
    - "zh-tw"
    - "ko"

